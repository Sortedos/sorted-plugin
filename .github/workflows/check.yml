# Runs this repository's own checks on every push and pull request.
# The leak scan's list of real names is private and is not stored here: without it the scan runs its self-test only
# (set the SORTED_DENYLIST secret to a private list's path on a self-hosted runner to scan for real names).
# The job is named "checks": that is the name to require as a status check on main (see SECURITY.md).
# Each action is pinned to the exact commit of the version named after it, so a later change to that version's tag cannot change what runs here.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: All checks
        run: python scripts/check_all.py
      - name: Feed call checker on the skills' own examples
        run: python scripts/check_feed_call.py --selftest
